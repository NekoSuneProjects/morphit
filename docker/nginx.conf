user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" cf="$http_cf_connecting_ip"';
  access_log /var/log/nginx/access.log main;

  map $http_cf_connecting_ip $morphit_real_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
  }

  server {
    listen 8080;
    server_name _;
    root /var/www/morphit;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # Public indexer API, same-origin with the frontend.
    location /v1/ {
      proxy_pass http://indexer:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $morphit_real_ip;
      proxy_set_header X-Forwarded-For $morphit_real_ip;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 10s;
      proxy_read_timeout 60s;
    }

    location /rss/ {
      proxy_pass http://indexer:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $morphit_real_ip;
      proxy_set_header X-Forwarded-For $morphit_real_ip;
      proxy_set_header X-Forwarded-Proto https;
    }

    # Morphit web resolves the relay to same-origin /relay.
    location = /relay {
      client_max_body_size 64k;
      proxy_pass http://relay:8080/relay;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $morphit_real_ip;
      proxy_set_header X-Forwarded-For $morphit_real_ip;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_connect_timeout 10s;
      proxy_read_timeout 60s;
    }

    location = /service-worker.js {
      try_files $uri =404;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      expires -1;
    }

    location = / {
      try_files /index.html =404;
      add_header Cache-Control "no-cache" always;
    }

    # Morphit intentionally does not use a blanket SPA fallback for unknown paths.
    location / {
      try_files $uri $uri/ =404;
    }
  }
}
